<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · prototype</title>
<meta name="description" content="{{DESCRIPTION}}">


<!-- No webfont. The palette and type stack resolve from the project;
     see _tokens.css for the resolution order. A project that wants a
     specific face declares it in its adapter. -->
<link rel="stylesheet" href="./_tokens.css">

<style>
/* ════════════════════════════════════════════════════════════════════
 * chrome-none — zero shell except a persistent project wordmark stamp
 * Use for gesture studies and isolated component tests.
 * The gesture itself is the primary subject of the view.
 * ════════════════════════════════════════════════════════════════════ */

.proto-stamp {
  position: fixed;
  top: var(--space-5);
  left: var(--space-6);
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--ink-ghost);
  z-index: 10;
}

.proto-stamp-label {
  position: fixed;
  top: var(--space-5);
  right: var(--space-6);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 400;
  color: var(--ink-ghost);
  z-index: 10;
}

.proto-stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-24) var(--pad);
}

.proto-content {
  width: 100%;
  max-width: var(--max-w-content);
}
</style>
</head>
<body>

<aside class="proto-stamp">{{PROJECT}}</aside>
<aside class="proto-stamp-label">{{TITLE}} · prototype</aside>

<main class="proto-stage">
  <div class="proto-content">
    {{CONTENT}}
  </div>
</main>

</body>
</html>
