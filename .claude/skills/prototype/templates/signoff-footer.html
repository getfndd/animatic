Per-item pattern, repeated inside {{OPEN_QUESTIONS_ITEMS}}.
DOT is var(--warning-600) when status=open, var(--success-600) when status=decided:

<li style="display:flex;gap:0.5rem;align-items:baseline">
  <span aria-hidden="true" style="flex:none;width:0.5rem;height:0.5rem;margin-top:0.4rem;border-radius:9999px;background:DOT"></span>
  <span><span style="color:var(--ink)">QUESTION</span> &middot; <b style="font-weight:500">STATUS</b> &middot; Recommended: RECOMMENDED. RECOMMENDED_REASON</span>
</li>

The dot is decoration, not information. Its state is also written as STATUS
text in the same line, because colour alone fails anyone who cannot
distinguish the two hues — and a status dot is exactly where that slips.
-->

  <ul style="list-style:none;margin:0.75rem 0 0;padding:0;display:flex;flex-direction:column;gap:0.5rem">
    {{OPEN_QUESTIONS_ITEMS}}
  </ul>
</footer>
