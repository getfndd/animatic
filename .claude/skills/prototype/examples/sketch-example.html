<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form - Sketch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <!-- SKETCH FIDELITY: Gray boxes, system fonts, no design tokens -->
  <div style="background: white; border: 1px solid #e0e0e0; padding: 32px; width: 100%; max-width: 400px;">
    <!-- Title -->
    <div style="font-size: 24px; font-weight: 600; color: #424242; margin-bottom: 8px;">
      Sign In
    </div>
    <div style="font-size: 14px; color: #9e9e9e; margin-bottom: 24px;">
      Welcome back. Enter your credentials.
    </div>

    <!-- Email field placeholder -->
    <div style="margin-bottom: 16px;">
      <div style="font-size: 14px; color: #616161; margin-bottom: 8px;">Email</div>
      <div style="border: 1px solid #e0e0e0; padding: 12px 16px; color: #9e9e9e;">
        you@example.com
      </div>
    </div>

    <!-- Password field placeholder -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 14px; color: #616161; margin-bottom: 8px;">Password</div>
      <div style="border: 1px solid #e0e0e0; padding: 12px 16px; color: #9e9e9e;">
        ••••••••
      </div>
    </div>

    <!-- Remember me checkbox placeholder -->
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
      <div style="width: 16px; height: 16px; border: 1px solid #e0e0e0;"></div>
      <div style="font-size: 14px; color: #616161;">Remember me</div>
    </div>

    <!-- Primary button placeholder -->
    <div style="border: 1px solid #424242; padding: 12px; text-align: center; font-weight: 600; color: #424242; margin-bottom: 16px;">
      Sign In
    </div>

    <!-- Secondary link -->
    <div style="text-align: center; font-size: 14px; color: #9e9e9e;">
      Don't have an account? <span style="color: #616161; text-decoration: underline;">Sign up</span>
    </div>
  </div>
</body>
</html>
