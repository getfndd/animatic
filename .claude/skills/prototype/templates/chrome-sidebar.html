<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — prototype</title>
<!-- No webfont. The palette and type stack resolve from the project;
     see _tokens.css for the resolution order. A project that wants a
     specific face declares it in its adapter. -->
  <link rel="stylesheet" href="./_tokens.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--surface); color: var(--ink-soft); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4, h5, h6 { color: var(--ink); }
    .mono { font-family: var(--font-mono); font-weight: 400; font-feature-settings: "tnum" 1; }
    .mono-uc { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono-num { font-family: var(--font-mono); font-weight: 300; letter-spacing: -0.01em; font-feature-settings: "tnum" 1, "ss01" 1; }

    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; flex-shrink: 0; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; padding: 20px 16px; background: var(--surface-2); border-right: 1px solid var(--rule); }
    .sidebar-brand { display: flex; align-items: baseline; gap: 6px; padding: 0 12px 24px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; color: var(--ink); }
    .sidebar-brand .slash { color: var(--ink-faint); font-weight: 400; }
    .sidebar-brand .sub { color: var(--ink-quiet); font-weight: 500; }
    .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 2px; font-size: 13px; color: var(--ink-soft); cursor: pointer; transition: background 140ms var(--ease-out); }
    .sidebar-item:hover { background: var(--ink-100); color: var(--ink); }
    .sidebar-item.active { background: var(--ink-100); color: var(--ink); font-weight: 500; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">{{PROJECT}}</div>
      <nav style="display: flex; flex-direction: column; gap: 2px;">
        <a class="sidebar-item active" href="#"><i class="ph ph-magnifying-glass" style="font-size: 16px; color: var(--ink-faint);"></i> Search</a>
        <a class="sidebar-item" href="#"><i class="ph ph-clock-counter-clockwise" style="font-size: 16px; color: var(--ink-faint);"></i> Recent</a>
        <a class="sidebar-item" href="#"><i class="ph ph-users-three" style="font-size: 16px; color: var(--ink-faint);"></i> Team shared</a>
      </nav>
      <div style="flex: 1;"></div>
      <a class="sidebar-item" href="#"><i class="ph ph-gear-six" style="font-size: 16px; color: var(--ink-faint);"></i> Settings</a>
    </aside>
    <div class="main">
      <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; height: 64px; flex-shrink: 0;">
        <span style="font-size: 13px; color: var(--ink-quiet);">{{TITLE}}</span>
      </header>
      <main style="flex: 1; padding: 0 40px 96px;">
        <div style="max-width: 760px; margin: 0 auto;">
          {{CONTENT}}
        </div>
      </main>
    </div>
  </div>
</body>
</html>
