<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">


<!-- No webfont. The palette and type stack resolve from the project;
     see _tokens.css for the resolution order. A project that wants a
     specific face declares it in its adapter. -->
<link rel="stylesheet" href="./_tokens.css">

<style>
/* ════════════════════════════════════════════════════════════════════
 * chrome-minimal — pill navbar + contained main area (generic, unbranded)
 * Use for auth-gated interior prototypes: search, results, detail.
 * Pill nav uses interior nav items (search, team shared, account).
 * ════════════════════════════════════════════════════════════════════ */

.shell-main {
  padding-top: var(--nav-offset);
  padding-left: var(--pad);
  padding-right: var(--pad);
  padding-bottom: var(--space-24);
  max-width: var(--max-w-wide);
  margin: 0 auto;
  animation: pageIn var(--dur-tier2-in) var(--ease-out);
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .shell-main {
    padding-left: var(--pad-sm);
    padding-right: var(--pad-sm);
  }
}
</style>
</head>
<body>

<header class="proto-header">
  <div class="proto-header-inner">
    <nav class="pill-nav">
      <a href="/" class="pill-brand">{{PROJECT}}</a>
      <div class="pill-links">
        <a href="#" class="pill-link active">Search</a>
        <a href="#" class="pill-link">Team shared</a>
        <a href="#" class="pill-link">Account</a>
      </div>
      <a href="#" class="pill-cta">Sign out</a>
    </nav>
  </div>
</header>

<main class="shell-main">
  {{CONTENT}}
</main>

</body>
</html>
